name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel-ci:
    name: Laravel Tests, Frontend Build & Migrations
    runs-on: ubuntu-latest

    steps:
      # ── Checkout Repository ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Pastikan .env tidak ter-commit ke Git ──────────────────────────────
      - name: Ensure .env is not committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env file is tracked by git! Remove it immediately."
            exit 1
          fi
          echo ".env is not committed — OK"

      # ── Setup PHP 8.4 & Extensions ─────────────────────────────────────────
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, fileinfo, tokenizer, xml, xmlwriter
          tools: composer:v2
          coverage: none

      # ── Setup Node.js & NPM Cache ─────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # ── Prepare .env untuk Lingkungan CI ──────────────────────────────────
      - name: Prepare .env for CI
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite
          sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          sed -i 's/DB_DATABASE=kampus_db/DB_DATABASE=database\/database.sqlite/' .env
          sed -i 's/SESSION_DRIVER=database/SESSION_DRIVER=array/' .env
          sed -i 's/QUEUE_CONNECTION=database/QUEUE_CONNECTION=sync/' .env
          sed -i 's/CACHE_STORE=database/CACHE_STORE=array/' .env

      # ── Cache & Install Composer Dependencies ─────────────────────────────
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress --ignore-platform-req=php+

      # ── Install NPM & Build Frontend Assets (Vite) ────────────────────────
      - name: Install NPM dependencies & Build Assets
        run: |
          npm ci
          npm run build

      # ── Security Audit Dependensi PHP ─────────────────────────────────────
      - name: Audit Composer dependencies
        run: composer audit --abandoned=ignore
        continue-on-error: true

      # ── Generate Application Key ──────────────────────────────────────────
      - name: Generate application key
        run: php artisan key:generate

      # ── migrate:fresh --seed (Validasi Seeder §4.4) ─────────────────────────
      - name: Run migrate:fresh --seed
        run: php artisan migrate:fresh --seed --force

      # ── migrate:refresh --seed (Idempotensi Seeder) ────────────────────────
      - name: Run migrate:refresh --seed
        run: php artisan migrate:refresh --seed --force

      # ── migrate:refresh (Verifikasi Rollback down()) ───────────────────────
      - name: Run migrate:refresh (no seed)
        run: php artisan migrate:refresh --force

      # ── Verifikasi Routes Terdaftar Bersih ─────────────────────────────────
      - name: Verify routes are loadable
        run: php artisan route:list

      # ── Jalankan Seluruh Test Suite ───────────────────────────────────────
      - name: Run PHPUnit tests
        run: php artisan test
