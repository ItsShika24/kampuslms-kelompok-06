name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  laravel-ci:
    name: Laravel Tests & Migration
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Pastikan .env tidak ter-commit ────────────────────────────────────
      - name: Ensure .env is not committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env file is tracked by git! Remove it immediately."
            exit 1
          fi
          echo ".env is not committed — OK"

      # ── Setup PHP ─────────────────────────────────────────────────────────
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, ctype, json, openssl
          coverage: none

      # ── Cache Composer dependencies ───────────────────────────────────────
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # ── Install PHP dependencies ──────────────────────────────────────────
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      # ── Prepare .env untuk CI ─────────────────────────────────────────────
      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Set SQLite database for CI
        run: |
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env

      - name: Generate application key
        run: php artisan key:generate

      # ── migrate:fresh --seed ──────────────────────────────────────────────
      - name: Run migrate:fresh --seed
        run: php artisan migrate:fresh --seed --force

      # ── migrate:refresh --seed ────────────────────────────────────────────
      - name: Run migrate:refresh --seed
        run: php artisan migrate:refresh --seed --force

      # ── migrate:refresh (tanpa seed, pastikan rollback/up berjalan) ───────
      - name: Run migrate:refresh (no seed)
        run: php artisan migrate:refresh --force

      # ── Verifikasi route dapat di-list tanpa error ────────────────────────
      - name: Verify routes are loadable
        run: php artisan route:list
