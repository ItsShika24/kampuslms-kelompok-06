# ==============================================================================
# Konfigurasi Supervisor Daemon Worker — KampusLMS (Kelompok 06)
# Disusun oleh: Shabrina Putri Az-Zahra (10241066) — Modul Minggu 12 (Milestone M4)
# Lokasi di Server: /etc/supervisor/conf.d/kampuslms-worker.conf
# ==============================================================================
# Berkas ini mengelola proses daemon worker antrean (database queue) di server Ubuntu.
# Memastikan pemrosesan event notifikasi publikasi tugas & penilaian berjalan otomatis
# di latar belakang tanpa memblokir request HTTP pengguna web.
# ==============================================================================

[program:kampuslms-worker]
# Penamaan proses individual saat numprocs > 1 (contoh: kampuslms-worker_00, kampuslms-worker_01)
process_name=%(program_name)s_%(process_num)02d

# Perintah artisan queue worker:
# - database: menggunakan driver queue database (tabel `jobs`)
# - --sleep=3: jeda 3 detik jika antrean kosong sebelum memeriksa job baru (menghemat CPU)
# - --tries=3: batas percobaan ulang jika terjadi exception sebelum job dipindahkan ke `failed_jobs`
# - --max-time=3600: membatasi umur proses maksimal 1 jam untuk mencegah kebocoran memori (memory leak)
command=php /var/www/kampuslms-kelompok-06/artisan queue:work database --sleep=3 --tries=3 --max-time=3600

# Supervisor otomatis menyalakan worker saat sistem operasi boot
autostart=true

# Supervisor otomatis me-restart worker jika proses crash atau selesai karena --max-time
autorestart=true

# Menjalankan worker di bawah pengguna web server www-data agar memiliki hak akses file storage
user=www-data

# Menjalankan 2 proses worker konkuren secara paralel (mempercepat distribusi puluhan notifikasi)
numprocs=2

# Mengalihkan standard error (stderr) ke standard output log (stdout)
redirect_stderr=true

# Lokasi berkas output log eksekusi background worker
stdout_logfile=/var/www/kampuslms-kelompok-06/storage/logs/worker.log

# Batas ukuran rotasi berkas log worker (maksimal 10 MB per file, simpan 5 backup)
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

# Waktu tunggu graceful shutdown (detik). Memberi kesempatan worker menyelesaikan job aktif sebelum di-SIGKILL
stopwaitsecs=3600

