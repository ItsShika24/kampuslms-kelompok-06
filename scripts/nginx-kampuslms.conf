# ==============================================================================
# Konfigurasi Nginx Produksi — KampusLMS (Kelompok 06)
# Disusun oleh: Tika Mila Wahyuni (10241070) — Modul Minggu 12 (Milestone M4)
# Lokasi di Server: /etc/nginx/sites-available/kampuslms
# Symlink Aktif: /etc/nginx/sites-enabled/kampuslms
# ==============================================================================

# 1. Redirect HTTP (Port 80) -> HTTPS (Port 443) Otomatis
server {
    listen 80;
    listen [::]:80;
    server_name kampuslms-kelompok-06.proweb.my.id kampuslms.my.id;

    # Redirect seluruh lalu lintas HTTP ke skema HTTPS aman
    return 301 https://$host$request_uri;
}

# 2. Server Blok Utama HTTPS (Port 443 SSL)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kampuslms-kelompok-06.proweb.my.id kampuslms.my.id;

    # KRITIS (Spesifikasi §12.1): Document root WAJIB mengarah ke /public!
    # Mengarahkan ke root repositori akan membocorkan .env, storage privat, dan composer.json.
    root /var/www/kampuslms-kelompok-06/public;

    # Sertifikat SSL (Dikelola otomatis oleh Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/kampuslms.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kampuslms.my.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Header Keamanan Produksi (Security Hardening)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    index index.php index.html;
    charset utf-8;

    # Batas ukuran upload berkas multipart (Sinkronisasi dengan Modul 9: max 20MB)
    client_max_body_size 25M;

    # Penanganan Rute Front-Controller Laravel 12
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Penanganan Halaman Kesalahan
    error_page 404 /index.php;

    # FastCGI Processor untuk PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # LAPISAN PERTAHANAN KEDUA: Blokir mutlak akses ke seluruh berkas tersembunyi / titik (.env, .git, dll)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Blokir akses langsung ke storage logs dan berkas sistem build
    location ~ ^/(storage/logs|composer\.(json|lock)|package\.(json|lock)|phpunit\.xml) {
        deny all;
        return 404;
    }
}

